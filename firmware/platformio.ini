; PlatformIO Project Configuration File for AquaSweep IoT device
;
; Build / upload / monitor:
;   pio run -t upload
;   pio device monitor
;
; Runtime deps managed by PlatformIO.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
    milesburton/DallasTemperature@^3.9.0
    paulstoffregen/OneWire@^2.3.8
build_flags =
    -DCORE_DEBUG_LEVEL=3