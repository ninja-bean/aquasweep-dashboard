# =====================================================
#  AquaSweep local MQTT broker — Mosquitto
#
#  The ESP32 talks to the TCP listener on :1883 (LAN).
#  The browser dashboard connects to the WebSocket
#  listener on :9001.
#
#  Configure the service to use this file (run elevated):
#    sc config mosquitto binPath= "\"C:\Program Files\Mosquitto\mosquitto.exe\" run -c \"D:\Projects\aquasweep-dashboard\infra\mosquitto.conf\""
#    sc stop mosquitto && sc start mosquitto
#
#  Or run it directly:
#    mosquitto -c D:\Projects\aquasweep-dashboard\infra\mosquitto.conf
# =====================================================

# ---- TCP listener for the ESP32 (all interfaces / LAN) ----
listener 1883
allow_anonymous true

# ---- WebSocket listener for the browser dashboard ----
listener 9001
protocol websockets

# ---- Persistence (retained online/offline status survives restarts) ----
persistence true
persistence_location D:/Projects/aquasweep-dashboard/infra/data

# ---- Logging (absolute paths are safe regardless of working directory) ----
log_dest file D:/Projects/aquasweep-dashboard/infra/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true